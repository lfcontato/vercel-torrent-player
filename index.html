<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTorrent Stream Player na Vercel</title>
    <style>
        /* CSS para a Interface */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #video-container {
            margin-top: 20px;
            min-height: 200px;
            background-color: #000;
        }

        /* Garantir que o player de vídeo injetado ocupe o container */
        #video-container video {
            width: 100%;
            display: none;
        }

        #info {
            margin-top: 15px;
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        #progress-bar {
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 10px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background-color: #007bff;
            border-radius: 5px;
            transition: width 0.3s;
        }

        button {
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #magnet-link-input {
                width: 100% !important;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>WebTorrent Stream Player (P2P no Navegador)</h1>
        <p>O cliente WebTorrent realiza o streaming progressivo diretamente no seu navegador, sem armazenar
            permanentemente.</p>

        <input type="text" id="magnet-link-input" placeholder="Cole seu Magnet Link aqui..."
            style="width: 70%; padding: 10px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px;"
            value="magnet:?xt=urn:btih:B3EU642NR2W4ZWQFX7WKCHJ63TYRSQEG&dn=Anonimo.2.2025.1080p.WEB-DL.DUAL.5.1&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&xl=2203990016">
        <button onclick="startStreaming()"
            style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px;">
            Iniciar Streaming
        </button>

        <div id="video-container">
        </div>

        <div id="progress-bar">
            <div id="progress"></div>
        </div>

        <div id="info">
            <p>Status: <span id="status">Aguardando link...</span></p>
            <p>Peers Ativos: <span id="peers">0</span></p>
            <p>Vel. Download: <span id="download-speed">0 KB/s</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/webtorrent@1.0.3/webtorrent.min.js"></script>

    <script>
        // 2. Lógica JavaScript
        const client = new WebTorrent();
        let currentTorrent = null;

        const statusEl = document.getElementById('status');
        const peersEl = document.getElementById('peers');
        const downloadSpeedEl = document.getElementById('download-speed');
        const progressBarEl = document.getElementById('progress');
        const videoContainerEl = document.getElementById('video-container');

        function log(message) {
            statusEl.textContent = message;
        }

        function startStreaming() {
            const magnetURI = document.getElementById('magnet-link-input').value.trim();

            if (!magnetURI.startsWith('magnet:')) {
                log('Erro: Link inválido. Use um link que comece com "magnet:".');
                return;
            }

            // --- PREVENÇÃO DE DUPLICIDADE E ERRO 'Cannot add duplicate torrent' ---
            if (currentTorrent) {
                currentTorrent.destroy();
                videoContainerEl.innerHTML = '';
                currentTorrent = null;
            }
            // ---------------------------------------------------------------------

            log('Iniciando. Baixando metadados...');
            progressBarEl.style.width = '0%';

            // Adicionar o magnet link ao cliente
            client.add(magnetURI, (torrent) => {
                currentTorrent = torrent;
                log('Metadados obtidos. Procurando peers...');

                // Encontrar o arquivo de mídia principal
                const file = torrent.files.find((f) => {
                    const name = f.name.toLowerCase();
                    // Suporte a formatos comuns, incluindo MKV (dependente do navegador)
                    return name.endsWith('.mp4') || name.endsWith('.mkv') || name.endsWith('.webm') || name.endsWith('.avi') || name.endsWith('.ogg');
                });

                if (file) {
                    // A chave do streaming: appendTo injeta o elemento <video> e inicia a reprodução
                    file.appendTo(videoContainerEl, { autoplay: true }, (err, elem) => {
                        if (err) {
                            log('Erro ao anexar o arquivo: ' + err.message);
                            return;
                        }
                        elem.style.display = 'block';
                        log(`Streaming de "${file.name}" iniciado.`);
                    });
                } else {
                    log('Erro: Nenhum arquivo de mídia suportado encontrado no torrent.');
                    torrent.destroy();
                    return;
                }

                // Atualização de Status da Interface
                torrent.on('wire', () => {
                    peersEl.textContent = torrent.numPeers;
                });

                torrent.on('done', () => {
                    log('Download completo e em seed!');
                });

                // Loop para atualizar a barra de progresso e a velocidade
                const updateInterval = setInterval(() => {
                    if (torrent.progress > 0) {
                        const progressPercent = (torrent.progress * 100).toFixed(1);
                        progressBarEl.style.width = progressPercent + '%';

                        const downloadRate = (torrent.downloadSpeed / 1024).toFixed(2);
                        downloadSpeedEl.textContent = `${downloadRate} KB/s`;

                        if (file && torrent.progress < 1) {
                            // Atualiza o progresso enquanto o streaming acontece
                            const currentStatus = statusEl.textContent;
                            if (!currentStatus.startsWith('Erro:')) {
                                statusEl.textContent = `Streaming de "${file.name}". Progresso Total: ${progressPercent}%`;
                            }
                        }
                    }
                }, 500);

                // Limpeza: Garante que o loop de atualização pare ao fechar
                torrent.on('close', () => clearInterval(updateInterval));

            }); // Fim do client.add()

            // Lidar com erros gerais do cliente WebTorrent
            client.on('error', (err) => {
                log('Erro Geral do Cliente WebTorrent: ' + err.message);
            });
        }

        // Inicializa o status ao carregar a página
        log('Aguardando link...');
    </script>

</body>

</html>
